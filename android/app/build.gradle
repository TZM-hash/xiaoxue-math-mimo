apply plugin: 'com.android.application'

android {
    namespace 'com.miaomiao.math'
    compileSdk 34

    defaultConfig {
        applicationId "com.miaomiao.math"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile file('../miaomiao-release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'miaomiao2024'
            keyAlias 'miaomiao'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'miaomiao2024'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}
