apply plugin: 'com.android.application'

def releaseStoreFile = file('../miaomiao-release.keystore')
def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile.exists() && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.miaomiao.math'
    compileSdk 34

    defaultConfig {
        applicationId "com.miaomiao.math"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.2.0"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias 'miaomiao'
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}
